<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3f7d5c" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1f2224" media="(prefers-color-scheme: dark)">
<meta name="description" content="Áreas, proyectos, módulos y tareas con recordatorios en Google Calendar y datos en Google Drive.">
<title>GlobalManager</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<header>
  <button class="icono" id="atras" hidden aria-label="Atrás">←</button>
  <h1 id="titulo">GlobalManager</h1>
  <span id="acciones"></span>
  <button class="icono" id="sync" data-estado="off" aria-label="Sincronizar"></button>
</header>

<main><div id="app"></div></main>

<button class="fab" id="fab" hidden aria-label="Añadir">＋</button>

<nav class="barra">
  <button data-ir="hoy"><b>◉</b>Hoy</button>
  <button data-ir="areas"><b>▤</b>Áreas</button>
  <button data-ir="buscar"><b>⌕</b>Buscar</button>
  <button data-ir="ajustes"><b>⚙</b>Ajustes</button>
</nav>

<div id="status" class="status" role="status" aria-live="polite"></div>

<div id="lightbox" hidden>
  <div class="lb-img"></div>
  <div class="lb-barra">
    <button class="lb-prev" aria-label="Anterior">‹</button>
    <span class="lb-n"></span>
    <button class="lb-next" aria-label="Siguiente">›</button>
    <button class="lb-cerrar" aria-label="Cerrar">Cerrar</button>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/util.js"></script>
<script src="js/store.js"></script>
<script src="js/carpeta.js"></script>
<script src="js/calendar.js"></script>
<script src="js/photos.js"></script>
<script src="js/notify.js"></script>
<script src="js/instalar.js"></script>
<!-- app.js define registra() y va antes que las vistas, que se registran al cargarse. -->
<script src="js/app.js"></script>
<script src="js/views/comun.js"></script>
<script src="js/views/home.js"></script>
<script src="js/views/areas.js"></script>
<script src="js/views/task.js"></script>
<script src="js/views/listas.js"></script>
<script src="js/views/entrada.js"></script>
<script src="js/views/buscar.js"></script>
<script src="js/views/ajustes.js"></script>
</body>
</html>
